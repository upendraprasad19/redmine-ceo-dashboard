# .opencode/hook/hooks.yaml
# Loaded by the opencode-yaml-hooks plugin (registered in .opencode/opencode.json).
#
# ALL hooks below are NON-BLOCKING (exit 0) by design. They only print reminders
# and never block tool execution. Do not add `action: stop` here.

hooks:
  # Remind the agent what to work on at session start.
  - id: session-start-reminder
    event: session.created
    actions:
      - bash: |
          echo "=== Next Task ==="
          node scripts/board.js next 2>/dev/null | sed 's/^/  Task /' || true
          echo "=== Vault ==="
          stat -c '%y' .opencode/vault/INDEX.md 2>/dev/null | sed 's/^/  Last updated: /' || echo "  No vault file"
          echo "=== Git ==="
          git status --short 2>/dev/null | head -5 | sed 's/^/  /' || true
          staged=$(git diff --cached --stat 2>/dev/null)
          if [ -n "$staged" ]; then
            echo "=== Staged ==="
            echo "$staged" | sed 's/^/  /'
            echo "  → Present diff to user before committing"
          fi
      - bash: "node scripts/discipline-reminder.js"

  # Remind after any file change that board/vault may need updating.
  - id: file-changed-reminder
    event: file.changed
    actions:
      - bash: "echo '  ↳ board/vault check due after file changes'"

  # Remind when strategy.md or sprint.md changes — verify board reflects new priorities.
  - id: strategy-sprint-reminder
    event: file.changed
    matchAllPaths:
      - "**/strategy.md"
      - "**/sprint.md"
    actions:
      - bash: "echo '  ↳ strategy/sprint updated — verify board reflects new priorities'"

  # Post-edit test reminder — remind to run tests after code file changes.
  - id: post-edit-reminder
    event: file.changed
    matchAllPaths:
      - "**/*.js"
      - "**/*.ts"
      - "**/*.jsx"
      - "**/*.tsx"
    actions:
      - bash: "echo '  ↳ File edited — run `npm run test:unit` to verify'"
      - bash: "echo '  ↳ Update board/vault if this edit closed a task or revealed a pattern'"

  # Self-learning reminder — check if tasks were completed in recent commits.
  - id: self-learning-reminder
    event: session.idle
    actions:
      - bash: |
          if git diff --name-only HEAD~1..HEAD 2>/dev/null | Select-String -Pattern "board/done/" -Quiet; then
            echo "  ↳ Board tasks completed — run `skill self-learning`"
          fi
